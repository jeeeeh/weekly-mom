name: 아기호랑이 소식지 보내기 (아기호랑이 전용 봇)

on:
  push:
    branches: [main]
    paths: ["tiger/20*.html"]
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 보낼 파일 찾기
        id: pick
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD -- 'tiger/20*.html' 2>/dev/null | grep -v -- '-print' | sort | tail -n 1)
          if [ -z "$FILE" ]; then FILE=$(ls tiger/20*.html | grep -v -- '-print' | sort | tail -n 1); fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
      - name: 텔레그램 발송
        env:
          TOKEN: ${{ secrets.TIGER_BOT_TOKEN }}
          CHATS: ${{ secrets.TIGER_CHAT_ID }}
          FILE: ${{ steps.pick.outputs.file }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHATS" ]; then echo "::warning::비밀값 TIGER_BOT_TOKEN / TIGER_CHAT_ID 를 먼저 등록하세요 (이번엔 보내지 않음)"; exit 0; fi
          WEEK=$(basename "$FILE" .html)
          STAMP=$(TZ=Asia/Seoul date +%m%d-%H%M)
          TITLE=$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "$FILE" | head -n 1)
          FAIL=0
          # TIGER_CHAT_ID 에 쉼표·띄어쓰기·줄바꿈으로 여러 방 ID를 넣으면 모두에게 보냄
          for ID in $(echo "$CHATS" | tr ', ' '\n\n' | sed '/^$/d' | sort -u); do
            RES=$(curl -sS -F chat_id="$ID" \
              -F document=@"$FILE;filename=아기호랑이-$WEEK-$STAMP.html" \
              -F caption="🐯 $TITLE  파일을 열면 이번 주 놀이·도전 재료·영상·나들이·챙길 것이 나와요." \
              "https://api.telegram.org/bot$TOKEN/sendDocument")
            if echo "$RES" | grep -q '"ok":true'; then echo "::notice::보냄 ...${ID: -4}"
            else echo "::error::실패 ...${ID: -4} : $(echo "$RES" | sed -n 's/.*"description":"\([^"]*\)".*/\1/p')"; FAIL=1; fi
            PDF="tiger/$WEEK-print.pdf"
            if [ -f "$PDF" ]; then
              RES=$(curl -sS -F chat_id="$ID" \
                -F document=@"$PDF;filename=아기호랑이-학습지-$WEEK.pdf" \
                -F caption="🖨️ 이번 주 학습지 (A4 2쪽) · 소식지 📚 배움 탭과 짝이에요" \
                "https://api.telegram.org/bot$TOKEN/sendDocument")
              if echo "$RES" | grep -q '"ok":true'; then echo "::notice::학습지 보냄 ...${ID: -4}"; else echo "::error::학습지 실패 ...${ID: -4}"; FAIL=1; fi
            fi
          done
          exit $FAIL

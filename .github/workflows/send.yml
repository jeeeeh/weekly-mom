name: 텔레그램으로 이번 주 소식지 보내기

on:
  push:
    branches: [main]
    paths: ["issues/**.html"]
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 보낼 파일 찾기
        id: pick
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD -- 'issues/*.html' 2>/dev/null | sort | tail -n 1)
          if [ -z "$FILE" ]; then FILE=$(ls issues/*.html | sort | tail -n 1); fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "보낼 파일: $FILE"
      - name: 텔레그램 발송 (내 방 + 단체방)
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROUP: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          FILE: ${{ steps.pick.outputs.file }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then echo "비밀값 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 를 먼저 등록하세요"; exit 1; fi
          WEEK=$(basename "$FILE" .html)
          STAMP=$(TZ=Asia/Seoul date +%m%d-%H%M)
          TITLE=$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "$FILE" | head -n 1)
          send() {
            RES=$(curl -sS \
              -F chat_id="$1" \
              -F document=@"$FILE;filename=다다다와함께-$WEEK-$STAMP.html" \
              -F caption="❤️ $TITLE ($WEEK~)  파일을 열면 이번 주 놀이·도전 재료·영상·체험·챙길 것이 나와요." \
              "https://api.telegram.org/bot$TOKEN/sendDocument")
            if echo "$RES" | grep -q '"ok":true'; then echo "::notice::보냄 ...${1: -4}"; return 0; fi
            DESC=$(echo "$RES" | sed -n 's/.*"description":"\([^"]*\)".*/\1/p')
            echo "::error::실패 ...${1: -4} : $DESC"; return 1
          }
          # TELEGRAM_CHAT_ID 에 쉼표·띄어쓰기·줄바꿈으로 여러 방 ID를 넣어도 각각 보냄
          IDS=$(printf '%s\n%s' "$CHAT" "$GROUP" | tr ', ' '\n\n' | sed '/^$/d' | sort -u)
          echo "::notice::받을 방 $(echo "$IDS" | wc -l)곳"
          FAIL=0
          for ID in $IDS; do
            send "$ID" || FAIL=1
          done
          exit $FAIL
